[project]
name = "les-cloches"
version = "0.1.0"
description = "Semantic desktop automation for corresponding with AI applications through their visible interfaces."
readme = "README.md"
authors = [
    { name = "phc260", email = "phc260@nyu.edu" }
]
requires-python = ">=3.12"
# AT-SPI (Atspi 2.0) and GDK 4 come from Linux system packages. The unsupported
# Windows prototype uses Microsoft UI Automation through pywinauto/pywin32.
dependencies = ["pywinauto>=0.6.9; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "easy: isolated deterministic tests using fakes or pure helpers",
    "medium: cross-module, platform-contract, subprocess, or recovery tests",
    "hard: end-to-end tests that control real desktop applications",
    "live: opt-in tests that control a real desktop application",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
